<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: url("https://dev.kaf.law/api/ai/Untitled-design-2024-09-04T144914.454.webp") center/cover fixed;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        /* ─── HEADER ─── */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            gap: 16px;
        }

        .header-logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .header-logo span {
            color: #22c55e;
        }

        .header-sub {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* أزرار تبديل القسم في الهيدر */
        .header-tabs {
            display: flex;
            gap: 6px;
            margin-right: auto;
        }

        .tab-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Cairo', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn:hover {
            background: rgba(22, 163, 74, 0.3);
            color: #fff;
        }

        .tab-btn.active {
            background: #16a34a;
            color: #fff;
            border-color: #16a34a;
        }

        /* ─── CHAT ─── */
        .chat-box {
            position: relative;
            z-index: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 85px 20px 100px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 4px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* ─── WELCOME ─── */
        .welcome {
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            margin: auto;
            padding: 30px 20px;
            animation: fadeIn 0.6s ease;
        }

        .welcome h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .welcome h2 span {
            color: #22c55e;
        }

        .welcome p {
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
            max-width: 440px;
            margin: 0 auto 24px;
        }

        .welcome-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .welcome-tag {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.75);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: 0.25s;
        }

        .welcome-tag:hover {
            background: #16a34a;
            color: #fff;
            border-color: #16a34a;
        }

        .welcome-tag.general {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.4);
            color: #86efac;
            font-weight: 600;
        }

        /* ─── MESSAGES ─── */
        .message {
            max-width: 72%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.9;
            font-size: 0.92rem;
            animation: fadeIn 0.3s ease;
            word-break: break-word;
        }

        .user {
            background: #16a34a;
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            text-align: right;
        }

        .ai {
            background: rgba(255, 255, 255, 0.96);
            color: #111;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            text-align: right;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 4px 2px;
            align-items: center;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: #16a34a;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            40% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        .uploaded-img {
            max-width: 180px;
            border-radius: 10px;
            margin-top: 8px;
            display: block;
        }

        /* transfer options داخل الرد */
        .transfer-options {
            margin-top: 14px;
            padding: 12px;
            background: rgba(22, 163, 74, 0.08);
            border: 1px solid rgba(22, 163, 74, 0.25);
            border-radius: 12px;
        }

        .transfer-options p {
            color: #166534;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.82rem;
        }

        .transfer-options-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .transfer-opt-btn {
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid rgba(22, 163, 74, 0.4);
            background: #fff;
            color: #166534;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .transfer-opt-btn:hover {
            background: #16a34a;
            color: #fff;
        }

        /* ─── INPUT ─── */
        .input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 10;
            padding: 10px 16px 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #message {
            flex: 1;
            padding: 11px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
            direction: rtl;
        }

        #message::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #message:focus {
            border-color: #22c55e;
        }

        .btn-send {
            background: #16a34a;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 11px 18px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-send:hover {
            background: #15803d;
        }

        .btn-upload {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 11px 14px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .btn-upload:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #file-preview {
            display: none;
            position: absolute;
            bottom: 68px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            gap: 8px;
            align-items: center;
        }

        #file-preview.visible {
            display: flex;
        }

        #file-preview button {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
        }

        /* badge */
        #intent-badge {
            display: none;
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.78rem;
            z-index: 20;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        #intent-badge.visible {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <div style="text-align:center">
            <div class="header-logo">كـ<span>ا</span>ف</div>
            <div class="header-sub" id="header-sub">مستشارك الطبي والقانوني</div>
        </div>
        <div class="header-tabs">
            <button class="tab-btn active" onclick="switchSection('patient')">🏥 مريض</button>
            <button class="tab-btn" onclick="switchSection('doctor')">👨‍⚕️ ممارس صحي</button>
            <button class="tab-btn" onclick="switchSection('lawyer')">⚖️ محامي</button>
        </div>
    </div>

    <div id="intent-badge">💬 وضع الاستفسار العام</div>

    <!-- CHAT -->
    <div class="chat-box" id="chat">
        <div class="welcome" id="welcome">
            <h2 id="welcome-title">مرحباً بك في <span>كاف</span></h2>
            <p id="welcome-desc">مستشارك الطبي والقانوني الذكي — اكتب حالتك مباشرة وسأحللها لك من أول رسالة</p>
            <div class="welcome-tags" id="welcome-tags">
                <div class="welcome-tag general" onclick="setIntent('general_inquiry')">💬 استفسار طبي عام</div>
                <div class="welcome-tag" onclick="quickSend('تعرضت لخطأ طبي في المستشفى')">🏥 خطأ طبي</div>
                <div class="welcome-tag" onclick="quickSend('أريد معرفة حقوقي كمريض')">📋 حقوق المريض</div>
                <div class="welcome-tag" onclick="quickSend('عندي شكوى ضد طبيب')">⚖️ شكوى ضد طبيب</div>
                <div class="welcome-tag" onclick="quickSend('ما هي مسؤولية المستشفى القانونية')">🏛️ مسؤولية المستشفى
                </div>
            </div>
        </div>
    </div>

    <!-- FILE PREVIEW -->
    <div id="file-preview">
        <span id="file-name"></span>
        <button onclick="clearFile()">✕</button>
    </div>

    <!-- INPUT -->
    <div class="input-area">
        <button class="btn-send" onclick="sendMessage()">إرسال</button>
        <input id="message" placeholder="اكتب حالتك أو سؤالك..." />
        <label class="btn-upload" title="إرفاق صورة">
            📎
            <input type="file" id="file" hidden accept="image/*" onchange="previewFile()">
        </label>
    </div>

    <script>
        const API_URL = "https://dev.kaf.law/api/ai/analyze";
        let apiHistory = [];
        let currentSection = "patient";   // patient / doctor / lawyer
        let intentType = "auto";

        // ══════════════════════════════════════
        // إعدادات كل قسم
        // ══════════════════════════════════════
        const SECTIONS = {
            patient: {
                sub: "مستشارك الطبي والقانوني",
                title: 'مرحباً بك في <span>كاف</span>',
                desc: "مستشارك الطبي والقانوني الذكي — اكتب حالتك مباشرة وسأحللها لك من أول رسالة",
                placeholder: "اكتب حالتك أو سؤالك...",
                tags: `
            <div class="welcome-tag general" onclick="setIntent('general_inquiry')">💬 استفسار طبي عام</div>
            <div class="welcome-tag" onclick="quickSend('تعرضت لخطأ طبي في المستشفى')">🏥 خطأ طبي</div>
            <div class="welcome-tag" onclick="quickSend('أريد معرفة حقوقي كمريض')">📋 حقوق المريض</div>
            <div class="welcome-tag" onclick="quickSend('عندي شكوى ضد طبيب')">⚖️ شكوى ضد طبيب</div>
            <div class="welcome-tag" onclick="quickSend('ما هي مسؤولية المستشفى القانونية')">🏛️ مسؤولية المستشفى</div>`,
                quickPrompts: {
                    'تعرضت لخطأ طبي في المستشفى': 'أخبرني بتفاصيل ما حدث: متى؟ وين؟ وش صار بالضبط؟ 🏥',
                    'أريد معرفة حقوقي كمريض': 'وضح لي وضعك — هل واجهت مشكلة معينة أو تريد تعرف حقوقك بشكل عام؟ 📋',
                    'عندي شكوى ضد طبيب': 'اشرح لي الموقف — وش سوى الطبيب؟ ومتى صار هذا؟ ⚖️',
                    'ما هي مسؤولية المستشفى القانونية': 'اشرح لي الحادثة — وش صار؟ وهل في ضرر وقع؟ 🏛️',
                }
            },
            doctor: {
                sub: "مستشارك القانوني للممارس الصحي",
                title: 'كاف <span>للممارس الصحي</span>',
                desc: "مستشارك القانوني المتخصص — اعرض حالتك السريرية أو الإجرائية وسأحللها من منظور طبي قانوني احترافي",
                placeholder: "اعرض حالتك السريرية أو الإجرائية...",
                tags: `
            <div class="welcome-tag" onclick="quickSend('لدي حالة خطأ طبي محتمل')">⚠️ خطأ طبي محتمل</div>
            <div class="welcome-tag" onclick="quickSend('أريد تقييم إجراء طبي قمت به')">🩺 تقييم إجراء طبي</div>
            <div class="welcome-tag" onclick="quickSend('كيف أوثق الحالة قانونياً')">📋 توثيق طبي قانوني</div>
            <div class="welcome-tag" onclick="quickSend('هل أنا معرض لدعوى قضائية')">⚖️ تقييم المسؤولية</div>`,
                quickPrompts: {
                    'لدي حالة خطأ طبي محتمل': 'اشرح لي الحالة السريرية — ما الإجراء المُتخذ وما النتيجة؟ ⚠️',
                    'أريد تقييم إجراء طبي قمت به': 'صف الإجراء كاملاً — التشخيص، البروتوكول، والنتيجة. 🩺',
                    'كيف أوثق الحالة قانونياً': 'أخبرني بطبيعة الحالة — حادثة، شكوى مريض، أم إجراء تريد توثيقه؟ 📋',
                    'هل أنا معرض لدعوى قضائية': 'اشرح الموقف — ما الذي حدث وما طبيعة الشكوى؟ ⚖️',
                }
            },
            lawyer: {
                sub: "المستشار القانوني للقضايا الطبية",
                title: 'كاف <span>للمحامي</span>',
                desc: "مستشارك في القضايا الطبية — اعرض قضيتك وسأعدّ لك تحليلاً قانونياً شاملاً مدعوماً بالأنظمة واللوائح",
                placeholder: "اعرض وقائع القضية أو استشارتك القانونية...",
                tags: `
            <div class="welcome-tag" onclick="quickSend('لدي قضية مسؤولية طبية')">⚖️ مسؤولية طبية</div>
            <div class="welcome-tag" onclick="quickSend('أريد تقييم قوة الدعوى')">📊 تقييم الدعوى</div>
            <div class="welcome-tag" onclick="quickSend('ما هي الأنظمة المطبقة على القضية')">📚 الأنظمة المطبقة</div>
            <div class="welcome-tag" onclick="quickSend('كيف أقدّر التعويض المناسب')">💰 تقدير التعويض</div>`,
                quickPrompts: {
                    'لدي قضية مسؤولية طبية': 'اعرض وقائع القضية — المدعي، الضرر، الإجراء موضع النزاع؟ ⚖️',
                    'أريد تقييم قوة الدعوى': 'اشرح الوقائع والأدلة — وسأقيّم أركان المسؤولية وقوة الدعوى. 📊',
                    'ما هي الأنظمة المطبقة على القضية': 'اعرض طبيعة القضية والوقائع — وسأستخرج الأنظمة ذات الصلة. 📚',
                    'كيف أقدّر التعويض المناسب': 'أخبرني بنوع الضرر — مادي، معنوي، جسدي — وسأحلل أسس التعويض. 💰',
                }
            }
        };

        // ══════════════════════════════════════
        // تبديل القسم
        // ══════════════════════════════════════
        function switchSection(type) {
            currentSection = type;
            intentType = "auto";
            apiHistory = [];

            const s = SECTIONS[type];

            // هيدر
            document.getElementById("header-sub").textContent = s.sub;

            // أزرار التبويب
            document.querySelectorAll(".tab-btn").forEach((btn, i) => {
                btn.classList.toggle("active", ["patient", "doctor", "lawyer"][i] === type);
            });

            // placeholder
            document.getElementById("message").placeholder = s.placeholder;

            // badge
            document.getElementById("intent-badge").classList.remove("visible");

            // شات — امسح المحادثة وأعد الصفحة الترحيبية
            const chat = document.getElementById("chat");
            chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h2 id="welcome-title">${s.title}</h2>
            <p>${s.desc}</p>
            <div class="welcome-tags">${s.tags}</div>
        </div>`;
        }

        // ══════════════════════════════════════
        // وضع الاستفسار العام
        // ══════════════════════════════════════
        function setIntent(type) {
            intentType = type;
            if (type === "general_inquiry") {
                const badge = document.getElementById("intent-badge");
                badge.textContent = "💬 وضع الاستفسار العام — اكتب سؤالك الطبي";
                badge.classList.add("visible");
                document.getElementById("message").placeholder = "اكتب سؤالك الطبي...";
                const welcome = document.getElementById("welcome");
                if (welcome) welcome.remove();
                appendMessage("اخترت الاستفسار الطبي العام 💬 — اكتب سؤالك وسأجيبك.", "ai");
                document.getElementById("message").focus();
            }
        }

        function resetIntent() {
            intentType = "auto";
            document.getElementById("intent-badge").classList.remove("visible");
            document.getElementById("message").placeholder = SECTIONS[currentSection].placeholder;
        }

        // ══════════════════════════════════════
        // Quick send
        // ══════════════════════════════════════
        function quickSend(label) {
            appendMessage(label, "user");
            const prompts = SECTIONS[currentSection].quickPrompts;
            const reply = prompts[label] || "اشرح لي تفاصيل حالتك أكثر عشان أقدر أحللها بدقة.";
            appendMessage(reply, "ai");
            document.getElementById("message").focus();
        }

        // ══════════════════════════════════════
        // File preview
        // ══════════════════════════════════════
        function previewFile() {
            const file = document.getElementById("file").files[0];
            if (file) {
                document.getElementById("file-name").textContent = "📎 " + file.name;
                document.getElementById("file-preview").classList.add("visible");
            }
        }
        function clearFile() {
            document.getElementById("file").value = "";
            document.getElementById("file-preview").classList.remove("visible");
        }

        // ══════════════════════════════════════
        // Messages
        // ══════════════════════════════════════
        function appendMessage(html, type) {
            const chat = document.getElementById("chat");
            const welcome = document.getElementById("welcome");
            if (welcome) welcome.remove();
            const div = document.createElement("div");
            div.className = "message " + type;
            div.innerHTML = html;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function showTyping() {
            const chat = document.getElementById("chat");
            const welcome = document.getElementById("welcome");
            if (welcome) welcome.remove();
            const div = document.createElement("div");
            div.className = "message ai";
            div.id = "typing";
            div.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        function removeTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }

        // ══════════════════════════════════════
        // Format
        // ══════════════════════════════════════
        function formatText(text) {
            let html = text
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
                .replace(/\n/g, "<br>");

            if (html.includes("[[TRANSFER_OPTIONS]]")) {
                html = html.replace("[[TRANSFER_OPTIONS]]", `
            <div class="transfer-options">
                <p>🔄 إذا انتهيت من الاستفسار، حوّل المحادثة لقسم متخصص:</p>
                <div class="transfer-options-btns">
                    <button class="transfer-opt-btn" onclick="switchSectionWithAnalysis('patient')">🏥 تحليل مريض</button>
                    <button class="transfer-opt-btn" onclick="switchSectionWithAnalysis('doctor')">👨‍⚕️ ممارس صحي</button>
                    <button class="transfer-opt-btn" onclick="switchSectionWithAnalysis('lawyer')">⚖️ محامي</button>
                </div>
            </div>`);
            }
            return html;
        }

        // ══════════════════════════════════════
        // تصحيح النص
        // ══════════════════════════════════════
        async function correctText(text) {
            if (text.split(" ").filter(w => w).length < 4) return text;
            try {
                const res = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-api-key": "YOUR_ANTHROPIC_KEY",
                        "anthropic-version": "2023-06-01"
                    },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 500,
                        messages: [{
                            role: "user", content:
                                `صحح الأخطاء اللغوية فقط بدون تعليق، وأعد النص المصحح فقط. إذا سليم أعده كما هو:\n\n"${text}"`
                        }]
                    })
                });
                const data = await res.json();
                return data?.content?.[0]?.text?.trim() || text;
            } catch { return text; }
        }

        // ══════════════════════════════════════
        // التحويل مع إرسال للتحليل
        // ══════════════════════════════════════
        async function switchSectionWithAnalysis(type) {
            const savedHistory = [...apiHistory];  // احفظ التاريخ قبل التبديل
            switchSection(type);
            apiHistory = savedHistory;             // أعد التاريخ بعد التبديل

            const question = "قدّم لي تحليلاً شاملاً بناءً على كل ما تحدثنا عنه";
            appendMessage(`${SECTIONS[type].sub} — أريد تحليلاً شاملاً`, "user");
            showTyping();

            const formData = new FormData();
            formData.append("question", question);
            formData.append("history", JSON.stringify(apiHistory));
            formData.append("user_type", type);
            formData.append("intent_type", "auto");

            try {
                const res = await fetch(API_URL, { method: "POST", body: formData });
                const text = await res.text();
                removeTyping();
                appendMessage(formatText(text), "ai");
                apiHistory.push({ role: "user", content: question });
                apiHistory.push({ role: "assistant", content: text });
            } catch {
                removeTyping();
                appendMessage("⚠️ تعذر الاتصال بالخادم.", "ai");
            }
        }

        // ══════════════════════════════════════
        // Send
        // ══════════════════════════════════════
        async function sendMessage() {
            const msgInput = document.getElementById("message");
            const fileInput = document.getElementById("file");
            const msg = msgInput.value.trim();
            const file = fileInput.files[0];
            if (!msg && !file) return;

            msgInput.value = "";
            msgInput.disabled = true;
            let finalMsg = msg ? await correctText(msg) : msg;
            msgInput.disabled = false;

            if (file) {
                const reader = new FileReader();
                reader.onload = e => appendMessage(
                    (finalMsg ? finalMsg + "<br>" : "") + `<img class="uploaded-img" src="${e.target.result}">`, "user"
                );
                reader.readAsDataURL(file);
            } else {
                appendMessage(finalMsg, "user");
            }

            showTyping();

            const formData = new FormData();
            formData.append("question", finalMsg || "انظر الصورة");
            formData.append("history", JSON.stringify(apiHistory));
            formData.append("user_type", currentSection);
            formData.append("intent_type", intentType);
            if (file) formData.append("file", file);

            if (intentType === "general_inquiry") resetIntent();

            try {
                const res = await fetch(API_URL, { method: "POST", body: formData });
                const text = await res.text();
                removeTyping();
                appendMessage(formatText(text), "ai");
                apiHistory.push({ role: "user", content: finalMsg || "انظر الصورة" });
                apiHistory.push({ role: "assistant", content: text });
            } catch {
                removeTyping();
                appendMessage("⚠️ تعذر الاتصال بالخادم، تأكد أن الـ API يعمل.", "ai");
            }

            clearFile();
        }

        document.getElementById("message").addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
